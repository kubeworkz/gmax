name: ci

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.build_type }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: build
        run: cmake --build build
      - name: test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: asan+ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: cmake -S . -B build/asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DGMAX_SANITIZE=ON
      - name: build
        run: cmake --build build/asan
      - name: test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/asan --output-on-failure

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: install clang-format
        run: pip install clang-format==18.1.8
      - name: check
        run: sh tools/check-format.sh

  # Same command a developer runs locally, so the gate cannot drift from it.
  offline:
    name: offline build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check
        run: sh tools/check-offline-build.sh debug

  # The pinned-tool gates are deliberately separate from the default test
  # matrix. The regular ctest invocation stays skip-friendly when Yosys or
  # MiniSat are absent; this job sets the GMAX_G0_*_GATE flags and uses the
  # pinned caches, so a missing or broken tool fails CI instead of producing
  # weaker evidence.
  sat-gate:
    name: G0.2/G0.3/G0.7 gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GMAX_DEP_CACHE: ${{ github.workspace }}/.gmax-cache
    steps:
      - uses: actions/checkout@v4
      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            build-essential \
            cmake \
            flex \
            libfl-dev \
            ninja-build \
            pkg-config \
            python3 \
            zlib1g-dev
      - name: cache pinned Yosys
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.gmax-cache/yosys/0.71
            ${{ github.workspace }}/.gmax-cache/download/yosys-0.71.tar.gz
          key: gmax-yosys-0.71-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('third_party/yosys-0.71.lock', 'tools/bootstrap-yosys.sh') }}
      - name: cache pinned MiniSat
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.gmax-cache/minisat/2.2.1
            ${{ github.workspace }}/.gmax-cache/download/minisat-2.2.1.tar.gz
          key: gmax-minisat-2.2.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('third_party/minisat-2.2.1.lock', 'tools/bootstrap-minisat.sh') }}
      - name: bootstrap pinned Yosys
        run: sh tools/bootstrap-yosys.sh
      - name: bootstrap pinned MiniSat
        run: sh tools/bootstrap-minisat.sh
      - name: configure gate build
        run: cmake -S . -B build/gate -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: build gate
        run: cmake --build build/gate
      - name: run G0.2 SAT smoke gate
        env:
          GMAX_G0_2_GATE: "1"
          GMAX_YOSYS: ${{ github.workspace }}/.gmax-cache/yosys/0.71/bin/yosys
          GMAX_MINISAT: ${{ github.workspace }}/.gmax-cache/minisat/2.2.1/bin/minisat
        run: ctest --test-dir build/gate -R '^cli\.sat-smoke$' --no-tests=error --output-on-failure
      - name: run G0.3 thread determinism gate
        env:
          GMAX_G0_3_GATE: "1"
          GMAX_YOSYS: ${{ github.workspace }}/.gmax-cache/yosys/0.71/bin/yosys
        run: ctest --test-dir build/gate -R '^cli\.threads$' --no-tests=error --output-on-failure
      - name: run G0.7 fault-simulation differential gate
        env:
          GMAX_G0_7_GATE: "1"
          GMAX_YOSYS: ${{ github.workspace }}/.gmax-cache/yosys/0.71/bin/yosys
        run: ctest --test-dir build/gate -R '^sim\.fault-diff$' --no-tests=error --output-on-failure
